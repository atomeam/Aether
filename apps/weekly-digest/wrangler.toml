name = "weekly-digest"
main = "src/index.ts"
compatibility_date = "2026-05-29"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# D1 Database bindings
[[d1_databases]]
binding = "DB"
database_name = "aether-bridge-db"
database_id = "f29243db-5b7a-407b-aa38-64091c1e0676"

# KV Namespaces
[[kv_namespaces]]
binding = "STATE"
id = "7319ee9195df4ccf8f4b2c8449dd7930"

[[kv_namespaces]]
binding = "STATE_CACHE"
id = "d22e703c3af9451a9942fa2a551a1aa8"

[vars]
ENVIRONMENT = "production"

[triggers]
crons = ["0 17 * * 5"]  # Friday 5pm ET (UTC 21:00)
