name = "cockpit"
main = "api/index.ts"
compatibility_date = "2024-01-01"

# Durable Object for telemetry hub
[[durable_objects.bindings]]
name = "TELEMETRY_HUB"
class_name = "TelemetryHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TelemetryHub"]

# KV namespace for mech state
[[kv_namespaces]]
binding = "MECH_STATE"
id = "84088798790b496ca25f37a2c632b78b"

# Routes
# Note: Custom domain requires enhanced API token permissions
# Worker is accessible directly at: https://cockpit.atomicmoonbeam88.workers.dev
# To enable custom domain, update token permissions and uncomment below:
# [[routes]]
# pattern = "devin.a-to-mind.com"
# custom_domain = true

# Environment variables (set via wrangler secret put)
# UPLINK_TOKEN - for Devin's local uplink agent
# VIEWER_TOKEN - for cockpit browser WebSocket authentication
# INGEST_TOKEN - for KV state ingestion from mech.ps1
# GITHUB_TOKEN - for GitHub Actions repository_dispatch
# WEBHOOK_TOKEN - for God Button webhook authentication