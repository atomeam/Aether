# =============================================================================
# AETHER-BRIDGE WORKER - Crew Executor
# =============================================================================
# 
# This worker consumes jobs from curator-jobs queue and executes them.
# It receives jobs from aether (dispatcher) and reports back when complete.
# =============================================================================

name = "aether-bridge"
account_id = "95745fedbea06314e24c27233033a37d"
main = "src/worker.ts"
compatibility_date = "2024-12-01"

# KV Namespaces
routes = [
  { pattern = "bridge.a-to-mind.com/*", custom_domain = true }
]

[[kv_namespaces]]
binding = "STATE"
id = "7319ee9195df4ccf8f4b2c8449dd7930"

[[kv_namespaces]]
binding = "STATE_CACHE"
id = "d22e703c3af9451a9942fa2a551a1aa8"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "council-routing-db"
database_id = "218e0bc6-f955-45d1-b9bf-276d384917c7"

# Cloudflare Queue - Consumer (processes curator-jobs)
[[d1_databases]]
binding = "BRIDGE_DB"
database_name = "aether-bridge-db"
database_id = "f29243db-5b7a-407b-aa38-64091c1e0676"

[[kv_namespaces]]
binding = "METRICS"
id = "49202b2460a74d2dbd6d747d35dda5b7"

[[queues.producers]]
binding = "CURATOR_QUEUE"
queue = "curator-jobs"

[[queues.consumers]]
queue = "curator-jobs"
max_batch_size = 1
max_retries = 3

# Browser for Puppeteer screenshots
[browser]
binding = "MYBROWSER"

# R2 Bucket for execution logs
# ACTIONS queue - needs to be created via Cloudflare API
# [[queues.producers]]
# binding = "ACTIONS"
# queue = "bridge-actions"

# [[queues.consumers]]
# queue = "bridge-actions"
# max_batch_size = 10
# max_retries = 3

[browser]
binding = "MYBROWSER"

[[services]]
binding = "DISPATCHER"
service = "aether"

[triggers]
crons = ["*/15 * * * *", "0 * * * *"]

[[r2_buckets]]
binding = "_LOGS"
bucket_name = "aether-logs"

# Service Binding - Call aether (dispatcher) directly
[[services]]
binding = "AETHER"
service = "aether"

[vars]
WORKER_ROLE = "executor"
# Auth keys for write endpoints (set via wrangler secret put in production)
# BRIDGE_NUCLEUS_KEY = "" # Set via: wrangler secret put BRIDGE_NUCLEUS_KEY
# BRIDGE_SERVICE_KEY = "" # Set via: wrangler secret put BRIDGE_SERVICE_KEY
[[routes]]
pattern = "bridge.a-to-mind.com"
custom_domain = true
