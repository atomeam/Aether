name = "uap-detection"
main = "src/complete-system.ts"
compatibility_date = "2024-01-01"
account_id = "95745fedbea06314e24c27233033a37d"

# D1 Database for anomaly storage
[[d1_databases]]
binding = "DB"
database_name = "uap-anomalies"
database_id = "519b06d6-4331-4990-beb2-280cde193221"

# KV for real-time alerts
[[kv_namespaces]]
binding = "ALERTS"
id = "4ff39cc2c4044bdab47df67dfe37cb1e"

# R2 for sensor data storage
[[r2_buckets]]
binding = "SENSOR_DATA"
bucket_name = "uap-sensor-data"

# Queue for async anomaly processing
[[queues.producers]]
queue = "uap-anomaly-processing"
binding = "uap_anomaly_processing"

# Vectorize for ML embeddings
[[vectorize]]
binding = "VECTORIZE"
index_name = "uap-embeddings"