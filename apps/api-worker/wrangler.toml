# D1 Database for events and proposals
[[d1_databases]]
binding = "DB"
database_name = "aether-api-db"
database_id = "218e0bc6-f955-45d1-b9bf-276d384917c7"

# KV Namespaces for real-time telemetry
[[kv_namespaces]]
binding = "LOXA_AGENT_STATE"
id = "da3d30ba717b4bef8b2325acae86a04b"

[[kv_namespaces]]
binding = "LOXA_INFRA_HEALTH"
id = "00aa0892c73145b495255b96f5fc3b51"

