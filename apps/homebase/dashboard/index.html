<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Orchestrator Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e4e4e7;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            border-radius: 20px;
            font-size: 0.9em;
            color: #00d4ff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .stat-card h3 {
            font-size: 0.9em;
            color: #a1a1aa;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .section h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #e4e4e7;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section h2::before {
            content: '';
            width: 4px;
            height: 30px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            border-radius: 2px;
        }

        .workflow-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .workflow-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .workflow-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .workflow-card .name {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 8px;
            color: #e4e4e7;
        }

        .workflow-card .schedule {
            font-size: 0.85em;
            color: #a1a1aa;
            margin-bottom: 12px;
        }

        .workflow-card .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .workflow-card .status.active {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid #22c55e;
        }

        .workflow-card .status.inactive {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .workflow-card button {
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 10px;
            transition: transform 0.2s ease;
        }

        .workflow-card button:hover {
            transform: scale(1.05);
        }

        .runs-table {
            width: 100%;
            border-collapse: collapse;
        }

        .runs-table th,
        .runs-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .runs-table th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: bold;
            color: #a1a1aa;
            text-transform: uppercase;
            font-size: 0.8em;
        }

        .runs-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .runs-table .status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .runs-table .status.completed {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .runs-table .status.failed {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .runs-table .status.started {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }

        .refresh-btn {
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            margin-left: auto;
            transition: transform 0.2s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #a1a1aa;
        }

        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .timestamp {
            font-size: 0.8em;
            color: #71717a;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Automation Orchestrator</h1>
            <span class="status-badge" id="systemStatus">Loading...</span>
            <p style="margin-top: 10px; color: #a1a1aa;">Unified automation management dashboard</p>
            <div style="margin-top: 15px;">
                <a href="/" style="color: #00d4ff; text-decoration: none; margin-right: 20px;">Home</a>
                <a href="/workflows" style="color: #00d4ff; text-decoration: none; margin-right: 20px;">Workflows</a>
                <a href="/runs-page" style="color: #00d4ff; text-decoration: none;">Runs</a>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Active Workflows</h3>
                <div class="value" id="activeWorkflows">-</div>
            </div>
            <div class="stat-card">
                <h3>Total Runs</h3>
                <div class="value" id="totalRuns">-</div>
            </div>
            <div class="stat-card">
                <h3>Success Rate</h3>
                <div class="value" id="successRate">-</div>
            </div>
            <div class="stat-card">
                <h3>System Uptime</h3>
                <div class="value" id="uptime">-</div>
            </div>
        </div>

        <div class="section">
            <div class="header-content">
                <h2>Scheduled Workflows</h2>
                <button class="refresh-btn" onclick="loadWorkflows()">🔄 Refresh</button>
            </div>
            <div id="workflowsContainer" class="workflow-grid">
                <div class="loading">Loading workflows...</div>
            </div>
        </div>

        <div class="section">
            <div class="header-content">
                <h2>Recent Runs</h2>
                <button class="refresh-btn" onclick="loadRuns()">🔄 Refresh</button>
            </div>
            <div id="runsContainer">
                <div class="loading">Loading runs...</div>
            </div>
        </div>

        <div class="section">
            <div class="header-content">
                <h2>📋 System Logs</h2>
                <button class="refresh-btn" onclick="loadLogs()">🔄 Refresh</button>
            </div>
            <div id="logsContainer">
                <div class="loading">Loading logs...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3333';

        async function fetchAPI(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error(`API Error (${endpoint}):`, error);
                throw error;
            }
        }

        async function loadSystemStatus() {
            try {
                const health = await fetchAPI('/health');
                document.getElementById('systemStatus').textContent = '● Online';
                document.getElementById('systemStatus').style.background = 'rgba(34, 197, 94, 0.2)';
                document.getElementById('systemStatus').style.color = '#22c55e';
                document.getElementById('systemStatus').style.borderColor = '#22c55e';
                
                const uptime = Math.floor(health.uptime);
                const hours = Math.floor(uptime / 3600);
                const minutes = Math.floor((uptime % 3600) / 60);
                document.getElementById('uptime').textContent = `${hours}h ${minutes}m`;
            } catch (error) {
                document.getElementById('systemStatus').textContent = '● Offline';
                document.getElementById('systemStatus').style.background = 'rgba(239, 68, 68, 0.2)';
                document.getElementById('systemStatus').style.color = '#ef4444';
                document.getElementById('systemStatus').style.borderColor = '#ef4444';
                document.getElementById('uptime').textContent = 'N/A';
            }
        }

        async function loadWorkflows() {
            const container = document.getElementById('workflowsContainer');
            try {
                const data = await fetchAPI('/scheduler/workflows');
                const workflows = data.workflows || [];
                
                document.getElementById('activeWorkflows').textContent = workflows.length;
                
                if (workflows.length === 0) {
                    container.innerHTML = '<div class="loading">No workflows configured</div>';
                    return;
                }

                // Workflow descriptions mapping
                const workflowDescriptions = {
                    'homebase_health_check': 'Health check for HomeBase service',
                    'homebase_wrapper': 'Wrapper for HomeBase operations',
                    'aether_backend_wrapper': 'Wrapper for Aether backend operations',
                    'project_health_check': 'Health check for all projects',
                    'system_monitor': 'System resource monitoring',
                    'failure_monitor': 'Monitor for workflow failures',
                    'daily_backup': 'Daily backup of all projects',
                    'log_cleanup': 'Clean up old log files',
                    'auto_restart': 'Auto-restart failed services',
                    'project_control': 'Manual project control (start/stop/restart)'
                };

                // Workflow schedule mapping
                const workflowSchedules = {
                    'homebase_health_check': 'Every 15 minutes',
                    'homebase_wrapper': 'Every 30 minutes',
                    'aether_backend_wrapper': 'Every 4 hours',
                    'project_health_check': 'Every 6 hours',
                    'system_monitor': 'Every 30 minutes',
                    'failure_monitor': 'Every 15 minutes',
                    'daily_backup': '2 AM daily',
                    'log_cleanup': '3 AM daily',
                    'auto_restart': 'Every 10 minutes',
                    'project_control': 'Manual trigger only'
                };

                container.innerHTML = workflows.map(workflow => `
                    <div class="workflow-card">
                        <div class="name">${workflow}</div>
                        <div class="schedule">${workflowSchedules[workflow] || 'Scheduled workflow'}</div>
                        <div style="font-size: 0.8em; color: #71717a; margin-bottom: 8px;">${workflowDescriptions[workflow] || 'Automation workflow'}</div>
                        <span class="status active">Active</span>
                        <button onclick="executeWorkflow('${workflow}')">▶ Execute Now</button>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = `<div class="error">Failed to load workflows: ${error.message}</div>`;
            }
        }

        async function loadRuns() {
            const container = document.getElementById('runsContainer');
            try {
                const runs = await fetchAPI('/runs?limit=10');
                
                // Filter out duplicate "started" entries and keep only completed/failed runs
                const uniqueRuns = runs.filter(run => run.status !== 'started');
                
                const completedRuns = uniqueRuns.filter(r => r.status === 'completed');
                const failedRuns = uniqueRuns.filter(r => r.status === 'failed');
                
                document.getElementById('totalRuns').textContent = uniqueRuns.length;
                const successRate = uniqueRuns.length > 0 ? ((completedRuns.length / uniqueRuns.length) * 100).toFixed(1) : 0;
                document.getElementById('successRate').textContent = `${successRate}%`;
                
                if (uniqueRuns.length === 0) {
                    container.innerHTML = '<div class="loading">No runs recorded</div>';
                    return;
                }

                container.innerHTML = `
                    <table class="runs-table">
                        <thead>
                            <tr>
                                <th>Workflow</th>
                                <th>Status</th>
                                <th>Trigger</th>
                                <th>Duration</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${uniqueRuns.slice(0, 10).map(run => `
                                <tr>
                                    <td>${run.workflow || 'Unknown'}</td>
                                    <td><span class="status ${run.status}">${run.status}</span></td>
                                    <td>${run.trigger || 'Unknown'}</td>
                                    <td>${run.duration_ms ? `${run.duration_ms}ms` : '-'}</td>
                                    <td class="timestamp">${new Date(run.timestamp).toLocaleTimeString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                container.innerHTML = `<div class="error">Failed to load runs: ${error.message}</div>`;
            }
        }

        async function loadLogs() {
            const container = document.getElementById('logsContainer');
            try {
                // Try to fetch recent runs as a log substitute
                const runs = await fetchAPI('/runs?limit=20');
                const uniqueRuns = runs.filter(run => run.status !== 'started');
                
                if (uniqueRuns.length === 0) {
                    container.innerHTML = '<div class="loading">No log entries available</div>';
                    return;
                }

                // Create a log-style display
                const logEntries = uniqueRuns.slice(0, 15).map(run => {
                    const timestamp = new Date(run.timestamp).toLocaleString();
                    const status = run.status.toUpperCase();
                    const duration = run.duration_ms ? `${run.duration_ms}ms` : 'N/A';
                    const trigger = run.trigger || 'UNKNOWN';
                    
                    // Color coding
                    let statusColor = '#22c55e'; // green for completed
                    if (run.status === 'failed') statusColor = '#ef4444'; // red for failed
                    
                    return `[${timestamp}] [${run.workflow}] [${trigger}] Status: ${status} | Duration: ${duration}`;
                }).join('\n');

                container.innerHTML = `
                    <div style="font-family: 'Courier New', monospace; font-size: 0.85em; line-height: 1.6;">
                        <div style="background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 8px; max-height: 400px; overflow-y: auto; color: #d4d4d8;">
                            <pre style="white-space: pre-wrap; word-wrap: break-word;">${logEntries}</pre>
                        </div>
                        <div style="margin-top: 15px; padding: 15px; background: rgba(0, 212, 255, 0.1); border-radius: 10px;">
                            <strong>📋 Log File Locations:</strong>
                            <div style="margin-top: 10px; font-family: monospace; font-size: 0.9em; color: #a1a1aa;">
                                <div>• Orchestrator: <code>~/automation_consolidation_v2/logs/orchestrator.log</code></div>
                                <div>• Run History: <code>~/automation_consolidation_v2/runs/runs.jsonl</code></div>
                            </div>
                            <div style="margin-top: 10px; font-size: 0.85em; color: #71717a;">
                                Showing recent 15 workflow executions from run history
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = `<div class="error">Failed to load logs: ${error.message}</div>`;
            }
        }

        async function executeWorkflow(workflowId) {
            try {
                const result = await fetchAPI(`/workflows/${workflowId}/execute`);
                alert(`Workflow "${workflowId}" executed successfully!\nRun ID: ${result.runId}`);
                setTimeout(() => {
                    loadRuns();
                }, 1000);
            } catch (error) {
                alert(`Failed to execute workflow: ${error.message}`);
            }
        }

        // Initial load
        loadSystemStatus();
        loadWorkflows();
        loadRuns();
        loadLogs();

        // Auto-refresh every 30 seconds
        setInterval(() => {
            loadSystemStatus();
            loadWorkflows();
            loadRuns();
            loadLogs();
        }, 30000);
    </script>
</body>
</html>
