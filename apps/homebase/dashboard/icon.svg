<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2cbf;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b2cbf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#1a1a2e"/>
  
  <!-- Main gear/circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#grad1)" stroke-width="12"/>
  
  <!-- Inner gear teeth -->
  <g fill="url(#grad2)">
    <rect x="248" y="40" width="16" height="60" rx="8"/>
    <rect x="248" y="412" width="16" height="60" rx="8"/>
    <rect x="40" y="248" width="60" height="16" rx="8"/>
    <rect x="412" y="248" width="60" height="16" rx="8"/>
    
    <!-- Diagonal teeth -->
    <rect x="120" y="100" width="16" height="60" rx="8" transform="rotate(45 128 130)"/>
    <rect x="376" y="352" width="16" height="60" rx="8" transform="rotate(45 384 382)"/>
    <rect x="376" y="100" width="16" height="60" rx="8" transform="rotate(-45 384 130)"/>
    <rect x="120" y="352" width="16" height="60" rx="8" transform="rotate(-45 128 382)"/>
  </g>
  
  <!-- Center circle -->
  <circle cx="256" cy="256" r="80" fill="url(#grad1)"/>
  
  <!-- Robot face -->
  <g fill="#1a1a2e">
    <!-- Eyes -->
    <circle cx="220" cy="240" r="20"/>
    <circle cx="292" cy="240" r="20"/>
    
    <!-- Mouth -->
    <rect x="230" y="280" width="52" height="8" rx="4"/>
    
    <!-- Antenna -->
    <rect x="252" y="160" width="8" height="40" rx="4"/>
    <circle cx="256" cy="150" r="12"/>
  </g>
  
  <!-- Circuit lines -->
  <g stroke="url(#grad2)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 100 200 L 140 200 L 160 240"/>
    <path d="M 412 312 L 372 312 L 352 272"/>
    <path d="M 200 412 L 200 372 L 240 352"/>
    <path d="M 312 100 L 312 140 L 272 160"/>
  </g>
  
  <!-- Small indicator dots -->
  <g fill="#00d4ff">
    <circle cx="100" cy="200" r="8"/>
    <circle cx="412" cy="312" r="8"/>
    <circle cx="200" cy="412" r="8"/>
    <circle cx="312" cy="100" r="8"/>
  </g>
</svg>