name: Anomaly Detection Monitor

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'simulate'
        type: choice
        options:
          - simulate
          - check
          - report

permissions:
  contents: read

jobs:
  anomaly-detection:
    name: Anomaly Detection Monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install anomaly detection dependencies
        run: |
          cd tools/anomaly-detection
          npm install

      - name: Simulate metrics
        if: github.event.inputs.action == 'simulate' || github.event.inputs.action == ''
        run: |
          cd tools/anomaly-detection
          npm run simulate

      - name: Check for anomalies
        if: github.event.inputs.action == 'check' || github.event.inputs.action == ''
        run: |
          cd tools/anomaly-detection
          npm run anomalies

      - name: Generate anomaly report
        if: github.event.inputs.action == 'report' || github.event.inputs.action == ''
        run: |
          cd tools/anomaly-detection
          npm run summary

      - name: Upload anomaly data
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.4
        with:
          name: anomaly-data
          path: tools/anomaly-detection/anomalies.json
          retention-days: 90

      - name: Upload metrics data
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.4
        with:
          name: metrics-data
          path: tools/anomaly-detection/metrics.json
          retention-days: 90

      - name: Notify on critical anomalies
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          cd tools/anomaly-detection
          
          # Check for critical anomalies
          CRITICAL_COUNT=$(node -e "
            const anomalies = require('./anomalies.json');
            const critical = anomalies.filter(a => a.severity === 'critical');
            console.log(critical.length);
          ")
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"🚨 Anomaly Detection Alert: $CRITICAL_COUNT critical anomalies detected in Aether. Check the anomaly report for details.\"}" \
              || echo "Slack notification skipped"
          fi
