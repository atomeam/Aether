name: Security Scanner

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of scan to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - secrets
          - dependencies
          - config

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install security scanner dependencies
        run: |
          cd tools/security-scanner
          npm install

      - name: Run full security scan
        if: github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == ''
        run: |
          cd tools/security-scanner
          npm run scan

      - name: Scan for secrets only
        if: github.event.inputs.scan_type == 'secrets'
        run: |
          cd tools/security-scanner
          npm run secrets

      - name: Scan dependencies
        if: github.event.inputs.scan_type == 'dependencies'
        run: |
          cd tools/security-scanner
          npm run dependencies

      - name: Scan configurations
        if: github.event.inputs.scan_type == 'config'
        run: |
          cd tools/security-scanner
          npm run config

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.4
        with:
          name: security-scan-results
          path: tools/security-scanner/security-scan-results.json
          retention-days: 90

      - name: Notify on critical vulnerabilities
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          cd tools/security-scanner
          
          # Check for critical vulnerabilities
          CRITICAL_COUNT=$(node -e "
            const results = require('./security-scan-results.json');
            const latest = results[results.length - 1];
            const critical = latest.findings.filter(f => f.severity === 'critical');
            console.log(critical.length);
          ")
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"🔒 Security Alert: $CRITICAL_COUNT critical vulnerabilities found in Aether. Review the security scan results immediately.\"}" \
              || echo "Slack notification skipped"
          fi
