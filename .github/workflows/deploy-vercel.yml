name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to:
        description: 'Deployment target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # First run the CI checks
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci
        working-directory: .

      - run: npx turbo run test typecheck --parallel
        working-directory: .

  # Build the project
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci
        working-directory: .

      # Build all packages first (required for workspace dependencies)
      - run: npx turbo run build
        working-directory: .

      # Explicitly build backend to ensure dist/server.cjs exists
      - run: npm run build
        working-directory: apps/backend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/backend/dist
            apps/frontend/dist
            packages/*/dist
          retention-days: 1

  # Deploy to Vercel
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build]
    environment: ${{ github.event.inputs.deploy_to || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        id: pull

      - name: Build Vercel Production Application
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Extract Deployment URL
        run: |
          echo "deployment_url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null | grep -E 'https?://' | tail -1)" >> $GITHUB_OUTPUT
        id: deploy

      - name: Disable Vercel GitHub App Auto-deploy
        run: |
          echo "Disabling Vercel GitHub App auto-deploy..."
          # The Vercel API endpoint to remove GitHub integration
          # Requires listing connections first, then removing them
          INSTALLATIONS=$(curl -s "https://api.vercel.com/v1/integrations/deployments/vercel/${{ secrets.VERCEL_PROJECT_ID }}?limit=10" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}")
          
          if echo "$INSTALLATIONS" | grep -q '"id"'; then
            echo "Found GitHub installations, removing..."
            # Parse and remove each installation
            echo "$INSTALLATIONS" | jq -r '.[].id // .[].installationId // empty' 2>/dev/null | while read inst_id; do
              if [ -n "$inst_id" ]; then
                echo "Removing installation: $inst_id"
                curl -s -X DELETE "https://api.vercel.com/v1/integrations/deployments/vercel/${{ secrets.VERCEL_PROJECT_ID }}/$inst_id" \
                  -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" || true
              fi
            done
            echo "✅ GitHub App auto-deploy disabled via API"
          else
            echo "No GitHub installations found or API returned: $INSTALLATIONS"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Vercel Deployment\n\n✅ Deployed to: ${{ steps.deploy.outputs.deployment_url }}\n\n🔒 GitHub App auto-deploy has been disabled. Future deployments will only occur via CI.'
            })

  # Verify deployment
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Verify aether-production.vercel.app/api/stack
        run: |
          sleep 10  # Give deployment a moment to stabilize
          response=$(curl -s -o /dev/null -w "%{http_code}" https://aether-production.vercel.app/api/stack)
          if [ "$response" = "200" ]; then
            echo "✅ aether-production.vercel.app/api/stack is healthy"
          else
            echo "❌ aether-production.vercel.app/api/stack returned $response"
            exit 1
          fi

      - name: Verify a-to-mind.com/api/stack
        run: |
          sleep 5
          response=$(curl -s -o /dev/null -w "%{http_code}" https://a-to-mind.com/api/stack)
          if [ "$response" = "200" ]; then
            echo "✅ a-to-mind.com/api/stack is healthy"
          else
            echo "❌ a-to-mind.com/api/stack returned $response"
            exit 1
          fi