name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target (backend, frontend, bridge, all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - backend
          - frontend
          - bridge

env:
  ALLOW_DEGRADED: "1"
  NODE_ENV: production

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Backend to Vercel
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'backend'
        run: |
          cd apps/backend
          npx vercel --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Frontend to Vercel
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend'
        run: |
          cd apps/frontend
          npm run build
          npx vercel --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Bridge to Cloudflare
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'bridge'
        run: |
          cd apps/bridge
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
