name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target (frontend, bridge)"
        required: false
        default: "frontend"
        type: choice
        options:
          - frontend
          - bridge
          - all

env:
  NODE_ENV: production

jobs:
  deploy-frontend:
    name: Deploy Frontend
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend' || !github.event.inputs.target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build -w @aether/frontend

      - name: Deploy to Vercel
        run: cd apps/frontend && npx vercel --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-bridge:
    name: Deploy Bridge
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        working-directory: apps/bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
