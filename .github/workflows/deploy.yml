name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target (backend, frontend, bridge, all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - backend
          - frontend
          - bridge

env:
  ALLOW_DEGRADED: "1"
  NODE_ENV: production

jobs:
  verify-api-spec:
    name: Verify API Specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify health endpoint matches API_SPEC.md
        run: |
          curl -H "Authorization: Bearer ${{ secrets.ATOMIND_DEVIN_SECRET }}" \
            https://aether-bridge.atomicmoonbeam88.workers.dev/api/a-to-mind/health \
            -o health_response.json
          
          # Validate required fields exist
          if ! grep -q '"status"' health_response.json; then
            echo "ERROR: API health response missing 'status' field"
            exit 1
          fi
          
          if ! grep -q '"version"' health_response.json; then
            echo "ERROR: API health response missing 'version' field"
            exit 1
          fi
          
          if ! grep -q '"timestamp"' health_response.json; then
            echo "ERROR: API health response missing 'timestamp' field"
            exit 1
          fi
          
          echo "✅ API health endpoint matches API_SPEC.md specification"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: verify-api-spec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Backend to Vercel
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'backend'
        run: |
          cd apps/backend
          npx vercel --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Frontend to Vercel
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend'
        run: |
          cd apps/frontend
          npm run build
          npx vercel --prod --yes
        env:
          # actionlint-disable=context
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Bridge to Cloudflare
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'bridge'
        run: |
          cd apps/bridge
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
