name: Pre-Merge Validation
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
jobs:
  enforce-governance:
    name: Governance & Brand Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce strict 'a-to-mind' brand lock
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only --diff-filter=ACM "$BASE" "$HEAD" | grep -v '^\.github/workflows/pre-merge\.yml$' || true)
          if [ -z "$CHANGED" ]; then exit 0; fi
          if echo "$CHANGED" | xargs -r grep -inE '\batomind\b' | grep -iv 'a-to-mind'; then exit 1; fi
      - name: Production Hygiene
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only --diff-filter=ACM "$BASE" "$HEAD" | grep '\.ts$' || true)
          if [ -n "$CHANGED" ] && echo "$CHANGED" | xargs grep -n "console\.log"; then exit 1; fi
  build-and-test:
    name: Aether Build & Memory Loop Verification
    runs-on: ubuntu-latest
    needs: enforce-governance
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Lint & Typecheck
        run: |
          npm run lint --if-present
          npx tsc --noEmit
      - name: Verify Monorepo Build
        run: npm run build
      - name: Execute Memory Worker Runtime Tests
        working-directory: ./apps/agent-memory
        run: |
          echo "SERVER_SECRET=ci-test-hmac-secret-run" > .dev.vars
          echo "ADMIN_TOKEN=ci-admin-provisioning-token" >> .dev.vars
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 &
          WORKER_PID=$!
          sleep 5
          chmod +x test_memory.sh
          ./test_memory.sh
          kill $WORKER_PID
