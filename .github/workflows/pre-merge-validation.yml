name: Pre-Merge Validation

on:
  pull_request:
    branches: [main]

jobs:
  validation:
    name: Run pre-merge validation scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Check wrangler consistency
        run: bash scripts/pre-merge/check-wrangler-consistency.sh
        
      # Temporarily disabled - script has false positives on function parameters
      # - name: Check for duplicate properties
      #   run: bash scripts/pre-merge/check-duplicate-properties.sh
        
      - name: Check for secrets leaks
        run: bash scripts/pre-merge/check-secrets-leak.sh
