name: Migration Re-run 0002

on:
  workflow_dispatch:

env:
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

jobs:
  migration:
    name: Re-run migration 0002 for backfill URL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd3d9f4f6cf2a3eaac27e2495f8b63167568be
      
      - name: Setup Node
        uses: actions/setup-node@1f8c6b00b7c2639c2b2f2e8c5c7e233a9d5f8e
        with:
          node-version: 22
          cache: "npm"
          
      - name: Install dependencies
        run: npm ci
        working-directory: apps/bridge
        
      - name: Apply migration 0002
        run: npx wrangler d1 execute aether-bridge-db --remote --file=migrations/0002_events_council_logs.sql
        working-directory: apps/bridge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          
      - name: Verify schema
        run: npx wrangler d1 execute aether-bridge-db --remote --command="SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
        working-directory: apps/bridge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
