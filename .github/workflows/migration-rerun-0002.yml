name: Migration Re-run 0002

on:
  workflow_dispatch:

env:
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

jobs:
  migration:
    name: Re-run migration 0002 for backfill URL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "npm"
          
      - name: Install dependencies
        run: npm ci
        working-directory: apps/bridge
        
      - name: Apply migration 0002
        run: npx wrangler d1 execute aether-bridge-db --remote --file=migrations/0002_events_council_logs.sql
        working-directory: apps/bridge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          
      - name: Verify schema
        run: npx wrangler d1 execute aether-bridge-db --remote --command="SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
        working-directory: apps/bridge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
