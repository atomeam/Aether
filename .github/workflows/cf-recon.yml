name: CF Recon
on:
  workflow_dispatch:
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
jobs:
  whoami:
    name: Validate Token
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g wrangler
      - run: wrangler whoami
  kv:
    name: KV Namespaces
    runs-on: ubuntu-latest
    needs: whoami
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g wrangler
      - run: wrangler kv namespace list
  d1:
    name: D1 Databases
    runs-on: ubuntu-latest
    needs: whoami
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g wrangler
      - run: wrangler d1 list
  r2:
    name: R2 Buckets
    runs-on: ubuntu-latest
    needs: whoami
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g wrangler
      - run: wrangler r2 bucket list
  deployments:
    name: Bridge Deployments
    runs-on: ubuntu-latest
    needs: whoami
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g wrangler
      - run: wrangler deployments list --name aether-bridge
