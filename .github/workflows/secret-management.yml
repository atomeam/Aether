name: Secret Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - list
          - update
          - delete
      secret_name:
        description: 'Secret name (for update/delete)'
        required: false
        type: string
      secret_value:
        description: 'Secret value (for update)'
        required: false
        type: string

jobs:
  secret-management:
    runs-on: ubuntu-latest
    steps:
      - name: Secret Management
        uses: actions/github-script@v7.1.0
        with:
          github-token: ${{ secrets.GH_PAT_SECRET_MANAGEMENT }}
          script: |
            const action = '${{ github.event.inputs.action }}';
            const secretName = '${{ github.event.inputs.secret_name }}';
            const secretValue = '${{ github.event.inputs.secret_value }}';
            
            if (action === 'list') {
              // List all secrets
              const { data: secrets } = await github.rest.actions.listRepoSecrets({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              
              console.log('📋 Repository Secrets:');
              secrets.secrets.forEach(secret => {
                console.log(`  - ${secret.name} (updated: ${secret.updated_at})`);
              });
            } else if (action === 'update') {
              if (!secretName || !secretValue) {
                throw new Error('Secret name and value required for update');
              }
              
              // Update secret
              await github.rest.actions.createOrUpdateRepoSecret({
                owner: context.repo.owner,
                repo: context.repo.repo,
                secret_name: secretName,
                encrypted_value: Buffer.from(secretValue).toString('base64')
              });
              
              console.log(`✅ Updated secret: ${secretName}`);
            } else if (action === 'delete') {
              if (!secretName) {
                throw new Error('Secret name required for delete');
              }
              
              // Delete secret
              await github.rest.actions.deleteRepoSecret({
                owner: context.repo.owner,
                repo: context.repo.repo,
                secret_name: secretName
              });
              
              console.log(`🗑️  Deleted secret: ${secretName}`);
            }
