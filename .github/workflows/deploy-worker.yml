name: Deploy Workers

on:
  push:
    branches:
      - main
    paths:
      - 'apps/*/src/**'
      - 'apps/*/wrangler.toml'
      - 'packages/*/src/**'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Specific worker to deploy (blank = all changed)'
        required: false
        default: 'false'
      skip_build:
        description: 'Skip build step (for workers with pre-existing TS errors)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed workers
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Detect changed workers
        id: changes
        run: |
          ALL_WORKERS="bridge aether-verifier notion-worker weekly-digest homebase"

          if [ -n "${{ inputs.worker }}" ]; then
            CHANGED="${{ inputs.worker }}"
          else
            CHANGED=""
            for worker in $ALL_WORKERS; do
              if git diff --name-only HEAD~1 HEAD | grep -qE "^apps/${worker}/|^packages/"; then
                CHANGED="${CHANGED} ${worker}"
              fi
            done
          fi

          CHANGED=$(echo "$CHANGED" | xargs)

          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"worker\":[]}" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            MATRIX=$(echo "$CHANGED" | tr ' ' '\n' | jq -R . | jq -s '{worker: .}' -c)
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "Deploying: $CHANGED"
          fi

  deploy:
    name: Deploy ${{ matrix.worker }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d4e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build dependencies
        if: inputs.skip_build != 'true'
        run: npx turbo run build --filter=@aether/${{ matrix.worker }}...

      - name: Deploy ${{ matrix.worker }} to Cloudflare
        run: npx wrangler deploy
        working-directory: apps/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          EMOJI="✅"
          if [ "$STATUS" != "success" ]; then EMOJI="❌"; fi

          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"${EMOJI} Deploy *${{ matrix.worker }}*: ${STATUS}\nCommit: ${{ github.sha }}\nActor: ${{ github.actor }}\"}" \
            || echo "Slack notification skipped"