name: Slack RUN Report

on:
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
      task_id:
        required: true
        type: string
      type:
        required: true
        type: string
      repo:
        required: true
        type: string
      actor:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      ci_run_url:
        required: true
        type: string
      result:
        required: false
        type: string
      state:
        required: false
        type: string
        default: running

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  report:
    name: Post RUN header to Slack
    runs-on: ubuntu-latest
    if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
    steps:
      - name: Post RUN header
        run: |
          STARTED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          ENDED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          RUN_HEADER="RUN: ${{ inputs.run_id }}
          TASK: ${{ inputs.task_id }}
          TYPE: ${{ inputs.type }}
          ACTOR: ${{ inputs.actor }}
          STATE: ${{ inputs.state }}
          STARTED: ${STARTED}
          ENDED: ${ENDED}
          COMMIT: ${{ inputs.commit_sha }}
          CI: ${{ inputs.ci_run_url }}
          EVIDENCE: See CI run"

          RESULT_LINE=""
          if [ -n "${{ inputs.result }}" ]; then
            RESULT_LINE="RESULT (${{ inputs.run_id }}): ${{ inputs.result }}"
          fi

          # Escape newlines for JSON
          MESSAGE=$(echo -e "${RUN_HEADER}\n${RESULT_LINE}" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')

          curl -sf -X POST "${SLACK_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": ${MESSAGE}}" || echo "Slack webhook failed (is SLACK_WEBHOOK_URL configured?)"
