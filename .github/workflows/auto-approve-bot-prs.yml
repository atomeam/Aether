name: Auto-Approve Bot PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: github.actor == 'devin-ai-integration[bot]'
    steps:
      - name: Auto-approve PR
        uses: actions/github-script@v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Check if PR is from bot
            if (pullRequest.user.login === 'devin-ai-integration[bot]') {
              // Approve the PR
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'APPROVE',
                body: 'Auto-approved by GitHub Actions - PR from Devin bot'
              });
              
              console.log(`✅ Auto-approved PR #${context.issue.number}`);
            } else {
              console.log(`❌ Skipping - PR not from bot`);
            }
