name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/deploy-frontend.yml'

# No environment approval gate - automatic deployment on successful build
# CI/CD is the sole deployment mechanism with zero human blockers

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd3d9f4f6cf2a3eaac27e2495f8b63167568be

      - name: Setup Node
        uses: actions/setup-node@1f8c6b00b7c2639c2b2f2e8c5c7e233a9d5f8e
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: a-to-mind
          directory: apps/frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}