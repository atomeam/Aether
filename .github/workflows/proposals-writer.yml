name: proposals-writer

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: proposals-writer
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd3d9f4f6cf2a3eaac27e2495f8b63167568be

      - name: Setup Node
        uses: actions/setup-node@1f8c6b00b7c2639c2b2f2e8c5c7e233a9d5f8e
        with:
          node-version: 22

      - name: Run ProposalsWatcher once
        run: npx tsx packages/chaos/src/proposals-watcher.ts --once
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_STATE_ID: ${{ secrets.CF_KV_STATE_ID }}
          CF_KV_STATE_CACHE_ID: ${{ secrets.CF_KV_STATE_CACHE_ID }}

      - name: Verify
        run: |
          echo "Checking KV..."
          curl -s https://aether.atomicmoonbeam88.workers.dev/proposals | jq -r '.proposals[0].source'

