name: Secret Rotation Monitor

on:
  schedule:
    # Run on the 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - rotate-due
          - report

permissions:
  contents: read

jobs:
  secret-rotation:
    name: Secret Rotation Monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install secret rotation dependencies
        run: |
          cd tools/secret-rotation
          npm install

      - name: Check for due rotations
        if: github.event.inputs.action == 'check' || github.event.inputs.action == ''
        run: |
          cd tools/secret-rotation
          npm run check

      - name: Rotate due secrets
        if: github.event.inputs.action == 'rotate-due'
        run: |
          cd tools/secret-rotation
          npm run rotate-due
        env:
          # Cloudflare credentials for wrangler
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Generate rotation report
        if: github.event.inputs.action == 'report' || github.event.inputs.action == ''
        run: |
          cd tools/secret-rotation
          npm run report

      - name: Generate rotation summary
        if: github.event.inputs.action == 'report' || github.event.inputs.action == ''
        run: |
          cd tools/secret-rotation
          npm run summary

      - name: Upload rotation log
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.4
        with:
          name: rotation-log
          path: tools/secret-rotation/rotation-log.json
          retention-days: 90

      - name: Upload rotation schedule
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.4
        with:
          name: rotation-schedule
          path: tools/secret-rotation/rotation-schedule.json
          retention-days: 90

      - name: Notify Slack on due rotations
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          cd tools/secret-rotation
          
          # Check if there are due rotations
          DUE_COUNT=$(node -e "
            const schedule = require('./rotation-schedule.json');
            const now = new Date();
            let count = 0;
            for (const [name, config] of Object.entries(schedule)) {
              if (config.nextRotation && new Date(config.nextRotation) <= now) {
                count++;
              }
            }
            console.log(count);
          ")
          
          if [ "$DUE_COUNT" -gt 0 ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"🔐 Secret Rotation Alert: $DUE_COUNT secrets are due for rotation in Aether. Run the Secret Rotation Monitor workflow to rotate them.\"}" \
              || echo "Slack notification skipped"
          fi
