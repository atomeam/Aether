name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run health checks every hour
    - cron: '0 * * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  BRIDGE_URL: "https://bridge.a-to-mind.com"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - uses: actions/setup-node@1d0ff469b5ceaf9d42421da094586ffc1d1a4d77 # v4.2.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          
      - run: npm ci
        working-directory: .
        
      - run: npx turbo run test --parallel
        working-directory: .

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - uses: actions/setup-node@1d0ff469b5ceaf9d42421da094586ffc1d1a4d77 # v4.2.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          
      - run: npm ci
        working-directory: .
        
      - run: npx turbo run typecheck --parallel
        working-directory: .

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - uses: actions/setup-node@1d0ff469b5ceaf9d42421da094586ffc1d1a4d77 # v4.2.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          
      - run: npm ci
        working-directory: .
        
      - run: npx turbo run build
        working-directory: .

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Test Bridge Worker
        run: |
          echo "Testing Bridge Worker..."
          curl -f ${{ env.BRIDGE_URL }}/health
          curl -f ${{ env.BRIDGE_URL }}/api/stack
          curl -f ${{ env.BRIDGE_URL }}/crew/status
          echo "✓ Bridge Worker is healthy"

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Bridge Worker Health
        run: |
          echo "=== Health Check ==="
          status=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.BRIDGE_URL }}/health)
          if [ "$status" -eq 200 ]; then
            echo "✓ Bridge Worker is healthy"
          else
            echo "✗ Bridge Worker is down (HTTP $status)"
            exit 1
          fi