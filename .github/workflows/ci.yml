name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  BRIDGE_URL: "https://bridge.a-to-mind.com"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          
      - run: npm ci
        working-directory: .
        
      - run: npx turbo run test --parallel
        working-directory: .
        
      - name: Report deploy event to audit trail
        if: always()
        run: |
          curl -X POST "${{ env.BRIDGE_URL }}/ops/deploy-event" \
            -H "Content-Type: application/json" \
            -d '{
              "workflow": "CI",
              "run_id": "${{ github.run_id }}",
              "status": "${{ job.status }}",
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "actor": "${{ github.actor }}",
              "repository": "${{ github.repository }}",
              "job_name": "test"
            }'

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          
      - run: npm ci
        working-directory: .
        
      - run: npx turbo run typecheck --parallel
        working-directory: .
        
      - name: Report deploy event to audit trail
        if: always()
        run: |
          curl -X POST "${{ env.BRIDGE_URL }}/ops/deploy-event" \
            -H "Content-Type: application/json" \
            -d '{
              "workflow": "CI",
              "run_id": "${{ github.run_id }}",
              "status": "${{ job.status }}",
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "actor": "${{ github.actor }}",
              "repository": "${{ github.repository }}",
              "job_name": "typecheck"
            }'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          
      - run: npm ci
        working-directory: .
        
      - run: npx turbo run build
        working-directory: .
        
      - name: Report deploy event to audit trail
        if: always()
        run: |
          curl -X POST "${{ env.BRIDGE_URL }}/ops/deploy-event" \
            -H "Content-Type: application/json" \
            -d '{
              "workflow": "CI",
              "run_id": "${{ github.run_id }}",
              "status": "${{ job.status }}",
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "actor": "${{ github.actor }}",
              "repository": "${{ github.repository }}",
              "job_name": "build"
            }'