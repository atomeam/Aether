name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd3d9f4f6cf2a3eaac27e2495f8b63167568be
      
      - uses: actions/setup-node@1f8c6b00b7c2639c2b2f2e8c5c7e233a9d5f8e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          
      - run: npm ci
        working-directory: .
        
      - run: npx turbo run test --parallel
        working-directory: .

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd3d9f4f6cf2a3eaac27e2495f8b63167568be
      
      - uses: actions/setup-node@1f8c6b00b7c2639c2b2f2e8c5c7e233a9d5f8e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          
      - run: npm ci
        working-directory: .
        
      - run: npx turbo run typecheck --parallel
        working-directory: .

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    steps:
      - uses: actions/checkout@11bd3d9f4f6cf2a3eaac27e2495f8b63167568be
      
      - uses: actions/setup-node@1f8c6b00b7c2639c2b2f2e8c5c7e233a9d5f8e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          
      - run: npm ci
        working-directory: .
        
      - run: npx turbo run build
        working-directory: .