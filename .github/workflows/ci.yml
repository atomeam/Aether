name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies with retry
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3: pnpm install"
            if pnpm install --frozen-lockfile; then
              echo "Install succeeded on attempt $i"
              exit 0
            else
              echo "Install failed on attempt $i"
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          echo "Install failed after 3 attempts"
          exit 1

      - run: npx turbo run test --parallel
        working-directory: .

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies with retry
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3: pnpm install"
            if pnpm install --frozen-lockfile; then
              echo "Install succeeded on attempt $i"
              exit 0
            else
              echo "Install failed on attempt $i"
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          echo "Install failed after 3 attempts"
          exit 1

      - run: npx turbo run typecheck --parallel
        working-directory: .

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies with retry
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3: pnpm install"
            if pnpm install --frozen-lockfile; then
              echo "Install succeeded on attempt $i"
              exit 0
            else
              echo "Install failed on attempt $i"
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          echo "Install failed after 3 attempts"
          exit 1

      - run: npx turbo run build
        working-directory: .

  slack-report:
    name: Slack CI Report
    runs-on: ubuntu-latest
    needs: [test, typecheck, build]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Generate run_id
        id: run_id
        run: echo "run_id=$(uuidgen)" >> $GITHUB_OUTPUT

      - name: Determine CI status
        id: status
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.typecheck.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ]; then
            echo "state=succeeded" >> $GITHUB_OUTPUT
            echo "result=All checks passed" >> $GITHUB_OUTPUT
          else
            echo "state=failed" >> $GITHUB_OUTPUT
            echo "result=Test: ${{ needs.test.result }}, TypeCheck: ${{ needs.typecheck.result }}, Build: ${{ needs.build.result }}" >> $GITHUB_OUTPUT
          fi

      - name: Post CI result to Slack
        uses: ./.github/workflows/_slack-run-report.yml
        with:
          run_id: ${{ steps.run_id.outputs.run_id }}
          task_id: https://github.com/atomeam/Aether/pull/75
          type: ci_validation
          repo: ${{ github.repository }}
          actor: ${{ github.actor }}
          commit_sha: ${{ github.sha }}
          ci_run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          state: ${{ steps.status.outputs.state }}
          result: ${{ steps.status.outputs.result }}