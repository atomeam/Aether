name: CI

on:
  push:
    branches: [main, merge-all-changes]
  pull_request:
    branches: [main, merge-all-changes]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: CI / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies with retry
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3: pnpm install"
            if pnpm install --frozen-lockfile; then
              echo "Install succeeded on attempt $i"
              exit 0
            else
              echo "Install failed on attempt $i"
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          echo "Install failed after 3 attempts"
          exit 1

      - run: npx turbo run test --parallel
        working-directory: .

  typecheck:
    name: CI / TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies with retry
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3: pnpm install"
            if pnpm install --frozen-lockfile; then
              echo "Install succeeded on attempt $i"
              exit 0
            else
              echo "Install failed on attempt $i"
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          echo "Install failed after 3 attempts"
          exit 1

      - run: npx turbo run typecheck --parallel
        working-directory: .

  build:
    name: CI / Build
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies with retry
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3: pnpm install"
            if pnpm install --frozen-lockfile; then
              echo "Install succeeded on attempt $i"
              exit 0
            else
              echo "Install failed on attempt $i"
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          echo "Install failed after 3 attempts"
          exit 1

      - run: npx turbo run build
        working-directory: .

  strategy-metrics:
    name: Strategy Metrics
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies with retry
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3: pnpm install"
            if pnpm install --frozen-lockfile; then
              echo "Install succeeded on attempt $i"
              exit 0
            else
              echo "Install failed on attempt $i"
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          echo "Install failed after 3 attempts"
          exit 1

      - name: Verify strategy metrics contract
        run: pnpm run metrics:verify -- --contract infra/strategy-metrics.contract.json

  slack-report:
    name: Slack CI Report
    uses: ./.github/workflows/_slack-run-report.yml
    needs: [test, typecheck, build, strategy-metrics]
    if: always()
    with:
      run_id: ${{ github.run_id }}
      task_id: https://github.com/atomeam/Aether/pull/75
      type: ci_validation
      repo: ${{ github.repository }}
      actor: ${{ github.actor }}
      commit_sha: ${{ github.sha }}
      ci_run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      state: ${{ needs.test.result == 'success' && needs.typecheck.result == 'success' && needs.build.result == 'success' && needs.strategy-metrics.result == 'success' && 'succeeded' || 'failed' }}
      result: Test: ${{ needs.test.result }}, TypeCheck: ${{ needs.typecheck.result }}, Build: ${{ needs.build.result }}, Strategy-Metrics: ${{ needs.strategy-metrics.result }}