name: CI

on:
  push:
    branches: [main, merge-all-changes]
  pull_request:
    branches: [main, merge-all-changes]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: CI / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies with retry
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3: pnpm install"
            if pnpm install --frozen-lockfile; then
              echo "Install succeeded on attempt $i"
              exit 0
            else
              echo "Install failed on attempt $i"
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          echo "Install failed after 3 attempts"
          exit 1

      - run: npx turbo run test --parallel
        working-directory: .

  typecheck:
    name: CI / TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies with retry
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3: pnpm install"
            if pnpm install --frozen-lockfile; then
              echo "Install succeeded on attempt $i"
              exit 0
            else
              echo "Install failed on attempt $i"
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          echo "Install failed after 3 attempts"
          exit 1

      - run: npx turbo run typecheck --parallel
        working-directory: .

  build:
    name: CI / Build
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies with retry
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3: pnpm install"
            if pnpm install --frozen-lockfile; then
              echo "Install succeeded on attempt $i"
              exit 0
            else
              echo "Install failed on attempt $i"
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          echo "Install failed after 3 attempts"
          exit 1

      - run: npx turbo run build
        working-directory: .

  strategy-metrics:
    name: Strategy Metrics
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies with retry
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3: pnpm install"
            if pnpm install --frozen-lockfile; then
              echo "Install succeeded on attempt $i"
              exit 0
            else
              echo "Install failed on attempt $i"
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          echo "Install failed after 3 attempts"
          exit 1

      - name: Verify strategy metrics contract
        run: pnpm run metrics:verify -- --contract infra/strategy-metrics.contract.json

  slack-report:
    name: Slack CI Report
    runs-on: ubuntu-latest
    needs: [test, typecheck, build, strategy-metrics]
    if: always()
    steps:
      - name: Determine CI status
        id: status
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.typecheck.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.strategy-metrics.result }}" == "success" ]; then
            echo "state=succeeded" >> $GITHUB_OUTPUT
            echo "result=All checks passed" >> $GITHUB_OUTPUT
          else
            echo "state=failed" >> $GITHUB_OUTPUT
            echo "result=Test: ${{ needs.test.result }}, TypeCheck: ${{ needs.typecheck.result }}, Build: ${{ needs.build.result }}, Strategy-Metrics: ${{ needs.strategy-metrics.result }}" >> $GITHUB_OUTPUT
          fi

      - name: Post CI result to Slack
        run: |
          RUN_HEADER="RUN: ${{ github.run_id }}"
TASK: https://github.com/atomeam/Aether/pull/75
TYPE: ci_validation
ACTOR: ${{ github.actor }}
STATE: ${{ steps.status.outputs.state }}
STARTED: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
ENDED: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
PR: https://github.com/atomeam/Aether/pull/75
CI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
EVIDENCE: See CI run
RESULT (${{ github.run_id }}): ${{ steps.status.outputs.result }}"

          PAYLOAD="{
            \"text\": \"${RUN_HEADER}\n${TASK}\n${TYPE}\n${ACTOR}\n${STATE}\n${STARTED}\n${ENDED}\n${PR}\n${CI}\n${EVIDENCE}\n${RESULT}\"
          }"

          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}"