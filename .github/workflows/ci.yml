name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          
      - run: npm ci
        working-directory: .
        
      - run: npx turbo run test --parallel
        working-directory: .

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          
      - run: npm ci
        working-directory: .
        
      - run: npx turbo run typecheck --parallel
        working-directory: .

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          mkdir -p /tmp/gitleaks-install
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz -C /tmp/gitleaks-install
          sudo mv /tmp/gitleaks-install/gitleaks /usr/local/bin/

      - name: Scan for secrets
        run: gitleaks detect --no-git --source . --config .gitleaks.toml -v

  iac-drift-check:
    name: IaC Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate wrangler bindings against manifest
        run: bash scripts/iac-drift-check.sh

  strategy-metrics-verify:
    name: Strategy Metrics Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify metrics package exports
        run: node scripts/strategy-metrics-verify.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, typecheck, gitleaks, iac-drift-check, strategy-metrics-verify]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          
      - run: npm ci
        working-directory: .
        
      - run: npx turbo run build
        working-directory: .