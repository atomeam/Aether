name: Slack RUN Reporter Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Test RUN header posting
    uses: ./.github/workflows/_slack-run-report.yml
    secrets: inherit
    with:
      run_id: smoke-${{ github.run_id }}
      task_id: smoke-test
      type: code_change
      repo: ${{ github.repository }}
      actor: ${{ github.actor }}
      commit_sha: ${{ github.sha }}
      ci_run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      state: succeeded
      result: smoke test passed
