<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Direct Sales Email</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
    h1 { color: #333; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    textarea { width: 100%; height: 300px; padding: 10px; }
    input { width: 100%; padding: 10px; }
    button { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; font-size: 16px; }
    button:hover { background: #0056b3; }
    .preview { background: #f5f5f5; padding: 20px; margin-top: 20px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Send Direct Sales Email</h1>
  
  <div class="form-group">
    <label for="to">To:</label>
    <input type="email" id="to" value="hello@umatr.io">
  </div>
  
  <div class="form-group">
    <label for="subject">Subject:</label>
    <input type="text" id="subject" value="Production-Ready Autonomous Agent API - Alternative to Hiring">
  </div>
  
  <div class="form-group">
    <label for="body">Body:</label>
    <textarea id="body">Hi UMATR Team,

I saw your job posting for Senior Agentic AI Engineer. I have a production-ready autonomous agent system with API access that your client can use immediately instead of hiring.

What I have:
- Autonomous agent team system
- API access with priority rate limits
- Council session logs & replay
- Email support
- Multi-chain crypto payments (no KYC, instant settlement)

Pricing: $49/month for API access (vs $150k-180k/year salary)

Try it: https://aether-pay.pages.dev

API Documentation: https://github.com/atomeam/Aether

Why this makes sense for your client:
- Skip hiring process (months)
- Save $150k-180k/year in salary
- Get immediate access to production system
- Scale without headcount

This could be a win-win for you and your client - you save them money while still providing a solution.

Would you like to try the API before recommending to your client?

Best,
[Your Name]</textarea>
  </div>
  
  <button onclick="sendEmail()">Send Email</button>
  
  <div class="preview">
    <h3>Instructions:</h3>
    <ol>
      <li>Update the "Best, [Your Name]" line with your actual name</li>
      <li>Copy the email content</li>
      <li>Open your email client (Gmail, Outlook, etc.)</li>
      <li>Paste the content and send to hello@umatr.io</li>
      <li>Alternatively, call +44 (0) 20 3667 3779</li>
    </ol>
  </div>
  
  <script>
    function sendEmail() {
      const to = document.getElementById('to').value;
      const subject = document.getElementById('subject').value;
      const body = document.getElementById('body').value;
      
      const mailtoLink = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.open(mailtoLink);
    }
  </script>
</body>
</html>
