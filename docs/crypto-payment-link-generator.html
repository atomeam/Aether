<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Payment Link Generator</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #000; color: #fff; }
    h1 { color: #ffd700; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; background: #111; border: 1px solid #333; color: #fff; }
    button { background: #ffd700; color: #000; padding: 15px 30px; border: none; cursor: pointer; font-size: 16px; width: 100%; }
    button:hover { background: #ffed4a; }
    .result { background: #111; padding: 20px; margin-top: 20px; border-radius: 10px; }
    .price { font-size: 2em; font-weight: bold; color: #ffd700; margin: 20px 0; }
    .buy-button { background: #ffd700; color: #000; padding: 20px 40px; text-decoration: none; font-size: 1.5em; font-weight: bold; border-radius: 10px; display: inline-block; margin-top: 20px; }
    .buy-button:hover { background: #ffed4a; }
  </style>
</head>
<body>
  <h1>Crypto Payment Link Generator</h1>
  <p>Generate crypto payment links with zero configuration.</p>
  
  <div class="price">$9 one-time</div>
  
  <div class="form-group">
    <label>Email:</label>
    <input type="email" id="email" placeholder="your@email.com">
  </div>
  
  <div class="form-group">
    <label>Amount (USD):</label>
    <input type="number" id="amount" placeholder="49" value="49">
  </div>
  
  <button onclick="generateLink()">Generate Payment Link</button>
  
  <div class="result" id="result" style="display: none;">
    <label>Payment Link:</label>
    <input type="text" id="paymentLink" readonly>
    <button onclick="copyLink()" style="margin-top: 10px;">Copy Link</button>
  </div>
  
  <div style="text-align: center; margin-top: 30px;">
    <a href="https://aether-pay.pages.dev" class="buy-button">Buy Lifetime Access - $9</a>
    <p style="margin-top: 20px; color: #888;">One-time payment • Instant access</p>
    <div style="margin-top: 30px; font-size: 0.8rem;">
      <a href="https://aether-pay.pages.dev/terms.html" style="color: #888; margin: 0 10px;">Terms of Service</a>
      <a href="https://aether-pay.pages.dev/privacy.html" style="color: #888; margin: 0 10px;">Privacy Policy</a>
      <a href="mailto:bridge@a-to-mind.com" style="color: #888; margin: 0 10px;">Contact</a>
    </div>
  </div>
  
  <script>
    function generateLink() {
      const email = document.getElementById('email').value;
      const amount = document.getElementById('amount').value;
      const link = `https://bridge.a-to-mind.com/pay?amount=${amount}&email=${encodeURIComponent(email)}`;
      document.getElementById('paymentLink').value = link;
      document.getElementById('result').style.display = 'block';
    }
    
    function copyLink() {
      const link = document.getElementById('paymentLink');
      link.select();
      document.execCommand('copy');
      alert('Copied!');
    }
  </script>
</body>
</html>
