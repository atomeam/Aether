# =============================================================================
# AETHER WORKSPACE - Cloudflare Workers Configuration
# =============================================================================
# 
# This workspace consists of 3 Workers that work together as a connected system:
#
#   aether (dispatcher) → queues jobs to → aether-bridge (executor)
#   homebase - static dashboard/landing page
#
# Each worker has its own wrangler.toml in apps/*/wrangler.toml
# =============================================================================

name = "aether"
main = "apps/backend/src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "council-routing-db"
database_id = "218e0bc6-f955-45d1-b9bf-276d384917c7"

[[d1_databases]]
binding = "BRIDGE_DB"
database_name = "aether-bridge-db"
database_id = "f29243db-5b7a-407b-aa38-64091c1e0676"

# KV Namespaces
[[kv_namespaces]]
binding = "STATE"
id = "7319ee9195df4ccf8f4b2c8449dd7930"

[[kv_namespaces]]
binding = "STATE_CACHE"
id = "d22e703c3af9451a9942fa2a551a1aa8"

# R2 Bucket for structured logs
[[r2_buckets]]
binding = "_LOGS"
bucket_name = "aether-logs"

# Cloudflare Queue - Producer (dispatches jobs to curator-jobs)
[[kv_namespaces]]
binding = "METRICS"
id = "49202b2460a74d2dbd6d747d35dda5b7"

# Browser Run
[browser]
binding = "MYBROWSER"

# Cloudflare Queues (created manually: npx wrangler queues create curator-jobs)
# NOTE: the consumer for curator-jobs lives in apps/bridge/wrangler.toml
# (aether-bridge is the executor). The dispatcher only produces.
[[queues.producers]]
binding = "CURATOR_QUEUE"
queue = "curator-jobs"

# Service Binding - Call aether-bridge directly
[[services]]
binding = "BRIDGE"
service = "aether-bridge"

[vars]
WORKER_ROLE = "dispatcher"

# ACTIONS queue - needs to be created via Cloudflare API
# [[queues.producers]]
# binding = "ACTIONS"
# queue = "bridge-actions"

# [[queues.consumers]]
# queue = "bridge-actions"
# max_batch_size = 10
# max_retries = 3

[[services]]
binding = "DISPATCHER"
service = "aether"

[triggers]
crons = ["*/15 * * * *", "0 * * * *"]

[[routes]]
pattern = "aether.a-to-mind.com"
custom_domain = true
