# =============================================================================
# AETHER WORKSPACE - Cloudflare Workers Configuration
# =============================================================================
# 
# This workspace consists of 3 Workers that work together as a connected system:
#
#   aether (dispatcher) → queues jobs to → aether-bridge (executor)
#   homebase - static dashboard/landing page
#
# Each worker has its own wrangler.toml in apps/*/wrangler.toml
# =============================================================================

name = "aether"
main = "apps/backend/src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "council-routing-db"
database_id = "218e0bc6-f955-45d1-b9bf-276d384917c7"

# KV Namespaces
[[kv_namespaces]]
binding = "STATE"
id = "7319ee9195df4ccf8f4b2c8449dd7930"

[[kv_namespaces]]
binding = "STATE_CACHE"
id = "d22e703c3af9451a9942fa2a551a1aa8"

# R2 Bucket for structured logs
[[r2_buckets]]
binding = "_LOGS"
bucket_name = "aether-logs"

# Cloudflare Queue - Producer (dispatches jobs to curator-jobs)
[[queues.producers]]
binding = "CURATOR_QUEUE"
queue = "curator-jobs"

# Service Binding - Call aether-bridge directly
[[services]]
binding = "BRIDGE"
service = "aether-bridge"

[vars]
WORKER_ROLE = "dispatcher"
